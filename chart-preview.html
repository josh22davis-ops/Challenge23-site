<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chart Preview — Challenge 23</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf8; --surface: #ffffff; --text: #1a1a1f;
    --text-mid: #4a4a52; --text-light: #8a8a92; --accent: #e04a1a;
    --border: rgba(0,0,0,.06); --font-head: 'Sora', sans-serif;
    --font-body: 'Source Serif 4', Georgia, serif;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); padding: 40px 24px; }

  .chart-section { max-width: 800px; margin: 0 auto; }
  .chart-section .section-label {
    font-family: var(--font-head); font-size: 11px; font-weight: 600;
    letter-spacing: 2.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 20px;
  }
  .chart-section h2 {
    font-family: var(--font-head); font-size: clamp(26px, 3.5vw, 36px);
    font-weight: 700; line-height: 1.2; letter-spacing: -.3px;
    color: var(--text); margin-bottom: 20px;
  }
  .chart-section > p { font-size: 17px; color: var(--text-mid); line-height: 1.8; margin-bottom: 28px; }

  #workout-chart {
    position: relative; width: 100%; height: 380px;
    background: #1a1a1a; border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px; overflow: hidden; cursor: crosshair;
  }
  #workout-chart canvas { display: block; width: 100%; height: 100%; }

  .chart-stats {
    position: absolute; top: 10px; right: 20px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
    font-family: var(--font-head); font-size: 13px; font-weight: 600;
  }
  .chart-stat-avg { color: rgba(255,255,255,0.7); }
  .chart-stat-peak { color: #f0943c; }

  .chart-tooltip {
    position: absolute; pointer-events: none;
    background: rgba(30,30,30,0.95); border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px; padding: 12px 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
    opacity: 0; transition: opacity .15s ease;
    z-index: 10; min-width: 160px; backdrop-filter: blur(10px);
  }
  .chart-tooltip.visible { opacity: 1; }
  .chart-tooltip-bpm {
    font-family: var(--font-head); font-size: 22px; font-weight: 700;
    color: #ffffff; line-height: 1;
  }
  .chart-tooltip-heart { color: #f0943c; font-size: 16px; }
  .chart-tooltip-unit { font-size: 13px; font-weight: 500; color: rgba(255,255,255,.5); }
  .chart-tooltip-meta {
    font-family: var(--font-head); font-size: 12px; font-weight: 500;
    color: rgba(255,255,255,.5); margin-top: 6px;
  }
  .chart-tooltip-exercise {
    font-family: var(--font-head); font-size: 12px; font-weight: 600;
    color: rgba(255,255,255,.75); margin-bottom: 6px;
  }
  .chart-tooltip-warmup { color: #d4a040; }
  .chart-tooltip-work { color: #ef6060; }
  .chart-tooltip-recover { color: #40b860; }
  .chart-tooltip-hold { color: #d4c030; }

  .chart-legend {
    display: flex; gap: 20px; justify-content: center; margin-top: 16px; flex-wrap: wrap;
  }
  .chart-legend-item {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-head); font-size: 12px; font-weight: 500; color: var(--text-light);
  }
  .chart-legend-dot { width: 10px; height: 10px; border-radius: 3px; }
  .chart-hint {
    font-family: var(--font-head); font-size: 12px; color: var(--text-light);
    text-align: center; margin-top: 10px;
  }
</style>
</head>
<body>

<section class="chart-section">
  <p class="section-label">Explore a Session</p>
  <h2>This is what 23 minutes looks like.</h2>
  <p>Drag across the graph to explore a real workout. Every spike, dip, and plateau maps to a specific phase — and the app tracks all of it.</p>

  <div id="workout-chart">
    <canvas></canvas>
    <div class="chart-stats"></div>
    <div class="chart-tooltip"></div>
  </div>

  <div class="chart-legend">
    <div class="chart-legend-item"><div class="chart-legend-dot" style="background: rgba(180,120,40,0.7);"></div>Warmup</div>
    <div class="chart-legend-item"><div class="chart-legend-dot" style="background: rgba(200,60,60,0.7);"></div>Work</div>
    <div class="chart-legend-item"><div class="chart-legend-dot" style="background: rgba(45,130,55,0.7);"></div>Recover</div>
    <div class="chart-legend-item"><div class="chart-legend-dot" style="background: rgba(170,150,30,0.7);"></div>Hold</div>
  </div>
  <p class="chart-hint">Drag to explore · Hover for details</p>
</section>

<script src="chart.js"></script>
</body>
</html>
